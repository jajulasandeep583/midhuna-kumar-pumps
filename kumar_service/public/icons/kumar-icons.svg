<!--
  KUMAR icon set. Lucide-style 24x24 stroke geometry, one symbol per concept in
  a pump plant. Each carries its own stroke colour so the desk sidebar,
  shortcuts and doctype lists read at a glance instead of sharing one glyph.
-->
<svg id="frappe-symbols" aria-hidden="true" style="display: none;" xmlns="http://www.w3.org/2000/svg">

	<!-- monobloc pump: volute casing, delivery branch, foot -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-pump" fill="none" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="10" cy="11" r="5"/>
		<circle cx="10" cy="11" r="1.6"/>
		<path d="M15 8h4v4h-4"/>
		<path d="M10 16v3M6 19h8"/>
		<path d="M5 11H2"/>
	</symbol>

	<!-- submersible: slim borewell body in a bore -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-submersible" fill="none" stroke="#0891B2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M9 3h6v18H9z"/>
		<path d="M9 8h6M9 12h6M9 16h6"/>
		<path d="M12 3V1"/>
		<path d="M5 21h14"/>
	</symbol>

	<!-- electric motor: body, shaft, terminal box -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-motor" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<rect x="3" y="7" width="12" height="10" rx="2"/>
		<path d="M15 12h5"/>
		<path d="M7 7V5h4v2"/>
		<path d="M6 17v2M12 17v2"/>
	</symbol>

	<!-- serial nameplate: plate with an engraved line and a stamp -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-serial" fill="none" stroke="#0F766E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<rect x="3" y="5" width="18" height="14" rx="2"/>
		<path d="M7 10h10M7 14h6"/>
		<circle cx="17.5" cy="14" r="1.5"/>
	</symbol>

	<!-- QR / scan -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-qr" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<rect x="3" y="3" width="7" height="7" rx="1"/>
		<rect x="14" y="3" width="7" height="7" rx="1"/>
		<rect x="3" y="14" width="7" height="7" rx="1"/>
		<path d="M14 14h3v3h-3zM20 14v3M17 20h4"/>
	</symbol>

	<!-- warranty: shield with a tick -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-warranty" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6z"/>
		<path d="M9 12l2 2 4-4"/>
	</symbol>

	<!-- certificate: sheet with a rosette -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-certificate" fill="none" stroke="#B45309" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M5 3h11l3 3v9H5z"/>
		<path d="M8 8h8M8 11h5"/>
		<circle cx="16" cy="18" r="3"/>
		<path d="M14.5 20.5L14 23l2-1 2 1-.5-2.5"/>
	</symbol>

	<!-- claim: rupee document under review -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-claim" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M6 3h9l4 4v14H6z"/>
		<path d="M9 8h6M9 11h6M12 11c2 0 3 1.5 3 3s-1 3-3 3H9l5 3"/>
	</symbol>

	<!-- dealer / shopfront -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-dealer" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 9l1.5-5h15L21 9"/>
		<path d="M3 9h18v11H3z"/>
		<path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0"/>
		<path d="M9 20v-6h6v6"/>
	</symbol>

	<!-- service / spanner -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-service" fill="none" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M15.5 3.5a5 5 0 00-6.2 6.2L3 16v5h5l6.3-6.3a5 5 0 006.2-6.2l-3 3-2.5-.5-.5-2.5z"/>
	</symbol>

	<!-- technician -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-technician" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="12" cy="7" r="3.2"/>
		<path d="M6 21v-2a6 6 0 0112 0v2"/>
		<path d="M8.5 4.5a4 4 0 017 0"/>
	</symbol>

	<!-- complaint / speech alert -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-complaint" fill="none" stroke="#E11D48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M21 12a8 8 0 01-8 8H8l-5 2 1.5-4.5A8 8 0 1121 12z"/>
		<path d="M12 8v4M12 15h.01"/>
	</symbol>

	<!-- foundry heat: crucible pouring -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-heat" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 6h9l-1.5 7a3.5 3.5 0 01-6.5 0z"/>
		<path d="M13 8c3 0 5 2 5 5"/>
		<path d="M18 15c-1 1.5-1 3 0 4.5 1-1.5 1-3 0-4.5z"/>
		<path d="M3 21h10"/>
	</symbol>

	<!-- winding coil -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-winding" fill="none" stroke="#9333EA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 12h2M18 12h2"/>
		<path d="M6 12c0-2.2 1.3-4 3-4s3 1.8 3 4-1.3 4-3 4"/>
		<path d="M12 12c0-2.2 1.3-4 3-4s3 1.8 3 4-1.3 4-3 4"/>
	</symbol>

	<!-- test bench / gauge -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-test" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 17a9 9 0 0118 0"/>
		<path d="M12 17l4.5-4.5"/>
		<circle cx="12" cy="17" r="1.4"/>
		<path d="M3 20h18"/>
	</symbol>

	<!-- traceability: linked nodes -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-trace" fill="none" stroke="#0D9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="5" cy="6" r="2.2"/>
		<circle cx="19" cy="6" r="2.2"/>
		<circle cx="12" cy="18" r="2.2"/>
		<path d="M6.6 7.6L10.6 16M17.4 7.6L13.4 16M7.2 6h9.6"/>
	</symbol>

	<!-- quality check -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-quality" fill="none" stroke="#059669" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 4h16v16H4z"/>
		<path d="M8 12l3 3 5-6"/>
	</symbol>

	<!-- catalogue / model book -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-model" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 4h7v16H4z"/>
		<path d="M13 4h7v16h-7z"/>
		<path d="M6.5 8h2M15.5 8h2M6.5 12h2M15.5 12h2"/>
	</symbol>

	<!-- category / layers -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-category" fill="none" stroke="#0EA5E9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M12 3l9 5-9 5-9-5z"/>
		<path d="M3 13l9 5 9-5"/>
	</symbol>

	<!-- settings -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-settings" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="12" cy="12" r="3"/>
		<path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
	</symbol>

	<!-- report -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-report" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M5 3h9l5 5v13H5z"/>
		<path d="M8 12v5M12 10v7M16 14v3"/>
	</symbol>

	<!-- registration: form with a pen -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-registration" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M5 3h10l4 4v6"/>
		<path d="M5 3v18h7"/>
		<path d="M8 8h6M8 12h4"/>
		<path d="M20 15l-5 5-2.5.5.5-2.5 5-5z"/>
	</symbol>

	<!-- visit / route pin -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-visit" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11z"/>
		<circle cx="12" cy="10" r="2.4"/>
	</symbol>

	<!-- guide / how to use -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-guide" fill="none" stroke="#0891B2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 4h6a3 3 0 013 3v13a2.5 2.5 0 00-2.5-2.5H4z"/>
		<path d="M20 4h-6a3 3 0 00-3 3v13a2.5 2.5 0 012.5-2.5H20z"/>
	</symbol>

	<!-- management: the whole board at a glance -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-management" fill="none" stroke="#0B5394" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<rect x="3" y="3" width="8" height="8" rx="1.5"/>
		<rect x="13" y="3" width="8" height="5" rx="1.5"/>
		<rect x="13" y="10" width="8" height="11" rx="1.5"/>
		<rect x="3" y="13" width="8" height="8" rx="1.5"/>
	</symbol>

	<!-- sales: a rising line with a rupee -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-sales" fill="none" stroke="#2E9E5B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 17l5-5 3.5 3.5L21 6"/>
		<path d="M16 6h5v5"/>
		<path d="M4 21h3M4 21V9"/>
	</symbol>

	<!-- purchase: goods inward, box with a down arrow -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-purchase" fill="none" stroke="#E0781A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 9l9-5 9 5v10l-9 5-9-5z"/>
		<path d="M3 9l9 5 9-5"/>
		<path d="M12 14v6"/>
	</symbol>

	<!-- production: gear over a conveyor -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-production" fill="none" stroke="#8B3FA8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="12" cy="8" r="3.2"/>
		<path d="M12 3.2v1.6M12 11.2v1.6M16.8 8h-1.6M8.8 8H7.2"/>
		<path d="M15.4 4.6l-1.1 1.1M9.7 10.3l-1.1 1.1M15.4 11.4l-1.1-1.1M9.7 5.7L8.6 4.6"/>
		<path d="M3 17h18M5 21h14"/>
	</symbol>

	<!-- people: a crew, not one person -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-people" fill="none" stroke="#0F8B9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<circle cx="9" cy="8" r="3"/>
		<path d="M3 20a6 6 0 0112 0"/>
		<path d="M16 6.5a3 3 0 010 5.6"/>
		<path d="M18 20a5.5 5.5 0 00-3-4.9"/>
	</symbol>

	<!-- payroll: a wage slip with a rupee -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-payroll" fill="none" stroke="#2E9E5B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M5 3h14v18l-2.3-1.6L14.4 21l-2.4-1.6L9.6 21l-2.3-1.6L5 21z"/>
		<path d="M9 8h6M9 11h6M9 14h3"/>
	</symbol>

	<!-- the dealer's own shop -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-shop" fill="none" stroke="#0B5394" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 9l1.6-5h14.8L21 9"/>
		<path d="M3 9a2.4 2.4 0 004.5 1 2.4 2.4 0 004.5 0 2.4 2.4 0 004.5 0A2.4 2.4 0 0021 9"/>
		<path d="M5 11v9h14v-9"/>
		<path d="M10 20v-5h4v5"/>
	</symbol>

	<!-- masters: a card index. Deliberately NOT the settings gear - the Masters
	     screen owns a Settings link, and when the screen and one of its own
	     links draw the same glyph the nav stops reading as a hierarchy. -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-masters" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<rect x="3" y="6" width="18" height="14" rx="2"/>
		<path d="M7 6V4.5A1.5 1.5 0 018.5 3h7A1.5 1.5 0 0117 4.5V6"/>
		<path d="M3 11h18"/>
		<path d="M10 15h7"/>
		<path d="M7 15h.01"/>
	</symbol>

	<!-- warehouse: stock that is put away somewhere -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-warehouse" fill="none" stroke="#0891B2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 21V9l9-5 9 5v12"/>
		<path d="M7 21v-7h10v7"/>
		<path d="M7 17.5h10"/>
	</symbol>

	<!-- the plant itself, for the Production screen's own entry. Its children are
	     individual machines and jobs, so the parent needs to be the building. -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-factory" fill="none" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M3 21V10l5 3V10l5 3V10l5 3v8z"/>
		<path d="M18 13V4h3v17"/>
		<path d="M7 17h2M13 17h2"/>
	</symbol>

	<!-- the neutral fallback. Anything we have not given a glyph of its own gets
	     this, NOT a pump - a sidebar of two dozen identical pumps tells the
	     reader nothing, which is exactly what it used to do. -->
	<symbol viewBox="0 0 24 24" id="icon-kumar-list" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
		<path d="M8 6h12M8 12h12M8 18h12"/>
		<path d="M4 6h.01M4 12h.01M4 18h.01"/>
	</symbol>

</svg>
