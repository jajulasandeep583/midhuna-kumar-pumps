<!--
  Portal artwork sprite: a banner scene and four product silhouettes drawn from
  the shapes in the 2025 brochure (borewell submersible, openwell submersible,
  monobloc, jet pump). Vector rather than photographs so the portal stays fast
  on a village phone connection and needs no image pipeline - and so it recolours
  with the brand instead of clashing with it.

  Referenced from dealer_portal.html as <use href="...#kp-art-<id>">. It is a
  standalone file (not the desk sprite) because app_include_icons does not reach
  website pages.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">

  <!-- ============ banner scene: bore, water, field ============ -->
  <symbol id="kp-art-banner" viewBox="0 0 420 180" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="kpSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="kpWater" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8ad4ff"/>
        <stop offset="1" stop-color="#3aa0e8"/>
      </linearGradient>
    </defs>
    <circle cx="352" cy="40" r="30" fill="url(#kpSky)"/>
    <!-- field rows -->
    <g stroke="#ffffff" stroke-opacity=".22" stroke-width="2.5" stroke-linecap="round">
      <path d="M14 150 h392"/><path d="M32 163 h366"/>
    </g>
    <!-- crops -->
    <g fill="#9be89b" fill-opacity=".55">
      <path d="M58 150c0-9 5-15 5-15s5 6 5 15z"/>
      <path d="M92 150c0-11 6-18 6-18s6 7 6 18z"/>
      <path d="M300 150c0-9 5-15 5-15s5 6 5 15z"/>
      <path d="M336 150c0-12 6-19 6-19s6 7 6 19z"/>
    </g>
    <!-- delivery pipe + arcing water -->
    <path d="M150 150 V96 h34" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M186 96 C232 84 258 106 266 148" fill="none" stroke="url(#kpWater)" stroke-width="9"
          stroke-linecap="round"/>
    <g fill="#bfe9ff">
      <circle cx="276" cy="132" r="3.4"/><circle cx="284" cy="145" r="2.6"/>
      <circle cx="268" cy="120" r="2.2"/>
    </g>
    <!-- motor head on the bore -->
    <rect x="132" y="60" width="36" height="30" rx="7" fill="#ffffff" fill-opacity=".9"/>
    <rect x="140" y="48" width="20" height="14" rx="4" fill="#ffffff" fill-opacity=".65"/>
    <g stroke="#0b5394" stroke-width="2.4" stroke-linecap="round" opacity=".55">
      <path d="M139 70h22"/><path d="M139 78h22"/>
    </g>
  </symbol>

  <!-- ============ borewell submersible ============ -->
  <symbol id="kp-art-borewell" viewBox="0 0 48 48">
    <rect x="19" y="4" width="10" height="7" rx="2" fill="currentColor" opacity=".45"/>
    <rect x="16" y="11" width="16" height="20" rx="4" fill="currentColor"/>
    <g stroke="#ffffff" stroke-width="1.6" opacity=".7">
      <path d="M19 17h10"/><path d="M19 21h10"/><path d="M19 25h10"/>
    </g>
    <rect x="18" y="31" width="12" height="9" rx="3" fill="currentColor" opacity=".6"/>
    <path d="M24 40v4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
  </symbol>

  <!-- ============ openwell submersible ============ -->
  <symbol id="kp-art-openwell" viewBox="0 0 48 48">
    <ellipse cx="24" cy="12" rx="15" ry="5" fill="currentColor" opacity=".28"/>
    <path d="M9 12v22a15 5 0 0 0 30 0V12" fill="currentColor" opacity=".12"/>
    <rect x="18" y="18" width="12" height="15" rx="3.5" fill="currentColor"/>
    <path d="M24 33v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M24 18V9h9" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ============ monobloc ============ -->
  <symbol id="kp-art-monobloc" viewBox="0 0 48 48">
    <rect x="6" y="17" width="22" height="15" rx="4" fill="currentColor"/>
    <circle cx="33" cy="24.5" r="9.5" fill="currentColor" opacity=".55"/>
    <circle cx="33" cy="24.5" r="3.4" fill="#ffffff" opacity=".85"/>
    <path d="M33 15V9h7" fill="none" stroke="currentColor" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="9" y="32" width="30" height="4" rx="2" fill="currentColor" opacity=".4"/>
    <g stroke="#ffffff" stroke-width="1.5" opacity=".6">
      <path d="M10 21h14"/><path d="M10 25h14"/><path d="M10 29h14"/>
    </g>
  </symbol>

  <!-- ============ jet / self-priming ============ -->
  <symbol id="kp-art-jet" viewBox="0 0 48 48">
    <rect x="8" y="20" width="18" height="14" rx="4" fill="currentColor"/>
    <circle cx="31" cy="27" r="8.5" fill="currentColor" opacity=".5"/>
    <path d="M31 18.5V11" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="31" cy="9" r="3" fill="currentColor" opacity=".7"/>
    <path d="M8 27H3" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="10" y="34" width="26" height="4" rx="2" fill="currentColor" opacity=".4"/>
  </symbol>

  <!-- ============ small action glyphs ============ -->
  <symbol id="kp-art-register" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h11l3 3v13H5z"/><path d="M8 11h8M8 15h5"/><path d="M16 4v3h3"/>
  </symbol>
  <symbol id="kp-art-complaint" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/>
    <path d="M12 8v4M12 14.5v.01"/>
  </symbol>
  <symbol id="kp-art-claim" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/>
  </symbol>
  <symbol id="kp-art-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/>
    <path d="M12 8v8" stroke-dasharray="2 2.5"/>
  </symbol>
  <symbol id="kp-art-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 16.9v2.5a1.8 1.8 0 0 1-2 1.8 17.6 17.6 0 0 1-7.7-2.7 17.3 17.3 0 0 1-5.3-5.3A17.6 17.6 0 0 1 3.3 5.5 1.8 1.8 0 0 1 5.1 3.6h2.5a1.8 1.8 0 0 1 1.8 1.6c.1.9.3 1.7.6 2.5a1.8 1.8 0 0 1-.4 1.9L8.5 10.8a14 14 0 0 0 5.3 5.3l1.2-1.2a1.8 1.8 0 0 1 1.9-.4c.8.3 1.6.5 2.5.6a1.8 1.8 0 0 1 1.6 1.8z"/>
  </symbol>
  <symbol id="kp-art-certificate" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4" width="17" height="12" rx="2"/><path d="M7 8h6M7 11.5h4"/>
    <circle cx="16.5" cy="17.5" r="3"/><path d="M15 20.2l-.6 2.6 2.1-1.2 2.1 1.2-.6-2.6"/>
  </symbol>
</svg>
